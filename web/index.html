<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_mx_v_0_3">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>


  <!-- Preloads -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="sqlite3.wasm" as="fetch" crossorigin fetchpriority="low">
  <link rel="preload" href="powersync_db.worker.js" as="fetch" crossorigin>
  <link rel="preconnect" href="https://sftotiywbexrphdyepnk.supabase.co" crossorigin>
  <link rel="preload" href="canvaskit/canvaskit.wasm" as="fetch" type="application/wasm" crossorigin>

  <title>MX</title>
  <link rel="manifest" href="manifest.json">
  
  <meta name="theme-color" content="#FFFFFF">

  <style>
    :root {
      color-scheme: light dark;
      --background: #FFFFFF;
      --foreground: #2A2A2A;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #303030;
        --foreground: #FAFAFA;
      }
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --background: #FFFFFF;
      --foreground: #2A2A2A;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --background: #303030;
      --foreground: #FAFAFA;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--background);
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background);
      z-index: 9999;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid transparent;
      border-top-color: var(--foreground);
      border-right-color: var(--foreground);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation-duration: 2s;
      }
    }
  </style>

  <script>
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.setAttribute('data-theme', theme);
      }
    } catch (_) {}
  </script>
</head>

<body>
  <div id="loading">
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
