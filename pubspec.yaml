name: flutter_mx_v_0_3
description: Scavenger hunt PWA where admins create activities and players submit answers.
publish_to: 'none'

version: 1.0.0+1
environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqlite_async: ^0.14.5
  go_router: ^18.0.2
  supabase_flutter: ^2.18.0
  powersync: ^2.4.0
  image_picker: ^1.2.3
  # sqlite3_web 0.9.5 made WorkerDatabase a 'base' class, which breaks
  # sqlite_async 0.14.5 on web. Remove once sqlite_async ships a fix.
  sqlite3_web: '>=0.9.0 <0.9.5'
  pdf: ^3.13.1
  flutter_quill_to_pdf: ^2.3.9
  flutter_quill: ^11.6.0
  file_saver: ^0.7.0
  file_picker: ^13.1.0
  shared_preferences: ^2.3.0
  flutter_markdown_plus: ^1.0.12
  flutter_image_compress: ^2.5.1
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  flutter_map: ^8.3.2
  exif: ^3.3.0
  qr_flutter: ^4.1.0
  two_dimensional_scrollables: ^0.5.5
  cupertino_icons: ^2.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/terms.md
    - assets/terms.json